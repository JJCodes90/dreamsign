name: iOS

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test (iPhone Duo simulator)
    # Xcode 27.1+ is required: iPhone Duo's full-screen layout and fold APIs ship in the iOS 27.1 SDK.
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version

      - name: Pick simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          rt = sorted([k for k in d if "iOS" in k], key=lambda k: [int(x) for x in k.split("iOS-")[-1].split("-")])
          for preferred in ("iPhone Duo", "iPhone 17"):
              for k in reversed(rt):
                  for dev in d[k]:
                      if dev["name"] == preferred:
                          print(dev["udid"]); sys.exit()
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Simulator: $UDID"

      - name: Build and run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Dreamsign.xcodeproj \
            -scheme Dreamsign \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild.log | xcbeautify --renderer github-actions

      - name: Summarize errors
        if: failure()
        run: |
          grep -E "error:|fatal error|Test .*failed|✘|Expectation failed|issue recorded" xcodebuild.log | sort -u | head -150 || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: |
            xcodebuild.log
            TestResults.xcresult
          retention-days: 7

  ipa:
    name: Build installable IPA (unsigned, for sideloading)
    # Produces Dreamsign.ipa for Windows users: Sideloadly signs it with your Apple ID and installs it.
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version

      - name: Archive (Release, unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Dreamsign.xcodeproj \
            -scheme Dreamsign \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Dreamsign.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee archive.log | xcbeautify --renderer github-actions

      - name: Package IPA
        run: |
          APP="$RUNNER_TEMP/Dreamsign.xcarchive/Products/Applications/Dreamsign.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" -c "Print :MinimumOSVersion" -c "Print :NSAlarmKitUsageDescription" "$APP/Info.plist"
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qry ../Dreamsign.ipa Payload)
          ls -lh Dreamsign.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Dreamsign-ipa
          path: Dreamsign.ipa
          retention-days: 30

      - name: Upload archive log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: archive-log
          path: archive.log
          retention-days: 7
